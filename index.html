<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week Report — The Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1A1817; --surface: #242019; --surface-2: #2C2721; --hairline: #3A342C;
    --amber: #C4972F; --amber-dim: #8A6B24; --brick: #BF7361; --sage: #7C9473;
    --bone: #EDE6D8; --bone-dim: #A79E8E; --bone-faint: #928B81;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--bone); font-family: 'IBM Plex Sans', sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .display { font-family: 'Zilla Slab', serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .topbar { position: sticky; top: 0; z-index: 50; background: rgba(26,24,23,0.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--hairline); padding: 18px 32px 10px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
  .subbar { position: sticky; top: 56px; z-index: 49; background: rgba(26,24,23,0.97); border-bottom: 1px solid var(--hairline); padding: 8px 32px 12px; }
  .conftabs { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; margin-bottom: 8px; scrollbar-width: thin; scrollbar-color: var(--sage) transparent; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  .conftabs::-webkit-scrollbar { height: 4px; }
  .conftabs::-webkit-scrollbar-thumb { background: var(--sage); border-radius: 3px; }
  .conftab { flex-shrink: 0; background: transparent; border: 1px solid var(--hairline); color: var(--bone-faint); font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.03em; padding: 6px 13px; border-radius: 12px; cursor: pointer; transition: all 0.15s ease; }
  .conftab:hover { border-color: var(--sage); color: var(--bone); }
  .conftab.active { background: var(--sage); border-color: var(--sage); color: #1A1817; font-weight: 600; }
  .conftab.top-picks { border-color: var(--amber-dim); color: var(--amber); }
  .conftab.top-picks:hover { border-color: var(--amber); }
  .conftab.top-picks.active { background: var(--amber); border-color: var(--amber); color: #1A1817; }
  .gametab .star-badge { color: var(--amber); margin-right: 5px; letter-spacing: -1px; }
  .gametab.active .star-badge { color: #1A1817; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { color: var(--amber); font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
  .brand .sub { color: var(--bone-dim); font-size: 14px; text-transform: uppercase; letter-spacing: 0.12em; }
  .gametabs { display: flex; gap: 8px; overflow-x: auto; max-width: 100%; scrollbar-width: thin; scrollbar-color: var(--amber-dim) transparent; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  .gametabs::-webkit-scrollbar { height: 5px; }
  .gametabs::-webkit-scrollbar-thumb { background: var(--amber-dim); border-radius: 3px; }
  .gametab { flex-shrink: 0; background: transparent; border: 1px solid var(--hairline); color: var(--bone-dim); font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.04em; padding: 8px 16px; border-radius: 2px; cursor: pointer; transition: all 0.15s ease; }
  .gametab:hover { border-color: var(--amber-dim); color: var(--bone); }
  .gametab.active { background: var(--amber); border-color: var(--amber); color: #1A1817; font-weight: 600; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 32px; }
  .intro { padding: 56px 0 40px; border-bottom: 1px solid var(--hairline); }
  .intro .eyebrow { color: var(--amber); font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 14px; }
  .intro h1 { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 14px; }
  .intro p { color: var(--bone-dim); font-size: 15px; max-width: 620px; }
  .game { display: none; padding: 48px 0 80px; }
  .game.active { display: block; }
  .g-eyebrow { color: var(--bone-faint); font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 10px; }
  .matchup { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; flex-wrap: wrap; }
  .matchup h2 { font-size: 40px; font-weight: 600; letter-spacing: -0.01em; }
  .matchup .at { color: var(--bone-faint); font-size: 26px; font-weight: 400; }
  .market-line { color: var(--bone-dim); font-family: 'IBM Plex Mono', monospace; font-size: 14px; margin-bottom: 12px; }
  .weather-strip { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--bone-dim); background: var(--surface); border: 1px solid var(--hairline); border-radius: 4px; padding: 12px 18px; margin-bottom: 32px; }
  .weather-strip .w-label { color: var(--bone-faint); text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.1em; margin-right: 4px; }
  .weather-strip .w-item { display: flex; align-items: baseline; gap: 5px; }
  .weather-strip .w-item b { color: var(--bone); font-weight: 600; }
  .weather-strip.notable { border-color: var(--amber-dim); }
  .weather-strip.notable .w-flag { color: var(--amber); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; background: rgba(196,151,47,0.14); border: 1px solid rgba(196,151,47,0.35); padding: 2px 8px; border-radius: 3px; }
  .market-line .ml { color: var(--bone-faint); margin-left: 12px; }
  .pick-block { background: var(--surface); border: 1px solid var(--hairline); border-radius: 4px; padding: 32px; margin-bottom: 20px; }
  .pick-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap; margin-bottom: 22px; }
  .pick-label { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber); margin-bottom: 10px; }
  .pick-lean { font-size: 26px; font-weight: 600; }
  .pick-lean .line { color: var(--bone-dim); font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 400; margin-left: 10px; }
  .gauge-wrap { text-align: right; }
  .gauge { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 6px; }
  .slot { width: 34px; height: 34px; border-radius: 3px; border: 1.5px solid var(--hairline); position: relative; display: flex; align-items: center; justify-content: center; }
  .slot.filled { background: var(--amber); border-color: var(--amber); }
  .slot.filled::after { content: '★'; color: #1A1817; font-size: 17px; }
  .slot.empty::after { content: '★'; color: var(--hairline); font-size: 17px; }
  .slot.ceiling { border-color: var(--bone-faint); border-style: dashed; }
  .slot.ceiling::before { content: ''; position: absolute; top: -7px; right: -1px; left: -1px; height: 2px; background: repeating-linear-gradient(90deg, var(--bone-faint) 0 4px, transparent 4px 7px); }
  .gauge-caption { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--bone-faint); max-width: 250px; }
  .gauge-caption b { color: var(--bone-dim); }
  .pick-why { border-top: 1px solid var(--hairline); padding-top: 18px; }
  .why-row { display: flex; gap: 10px; font-size: 15px; color: var(--bone-dim); margin-bottom: 8px; align-items: flex-start; }
  .why-row:last-child { margin-bottom: 0; }
  .why-flag { flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 2px; margin-top: 1px; }
  .why-flag.caution { background: rgba(176,80,58,0.18); color: #D98A75; border: 1px solid rgba(176,80,58,0.4); }
  .why-flag.signal { background: rgba(196,151,47,0.14); color: var(--amber); border: 1px solid rgba(196,151,47,0.35); }
  .ml-check { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--hairline); font-size: 14.5px; color: var(--bone-faint); }
  .ml-check b { color: var(--bone-dim); }
  .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bone-faint); margin: 40px 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--hairline); }
  .stat-row { display: grid; grid-template-columns: 100px 1fr 90px 1fr 100px; align-items: center; gap: 10px; padding: 9px 0; font-size: 14.5px; }
  .stat-row .team-a { text-align: right; font-family: 'IBM Plex Mono', monospace; color: var(--bone-dim); }
  .stat-row .team-b { text-align: left; font-family: 'IBM Plex Mono', monospace; color: var(--bone-dim); }
  .stat-row .cat { text-align: center; color: var(--bone-faint); font-size: 13.5px; }
  .bar-a, .bar-b { height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
  .bar-a .fill { position: absolute; right: 0; top: 0; height: 100%; background: var(--bone-faint); border-radius: 3px; }
  .bar-b .fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--bone-faint); border-radius: 3px; }
  .bar-a .fill.win, .bar-b .fill.win { background: var(--amber); }
  .continuity-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 4px; }
  .cont-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 4px; padding: 16px 18px; }
  .cont-card .label { font-family: 'IBM Plex Mono', monospace; font-size: 14.5px; color: var(--bone-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .cont-pair { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .cont-pair .pct { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 500; }
  .cont-pair .who { font-size: 14px; color: var(--bone-faint); }
  .cont-pair.lead .pct { color: var(--amber); }
  .note-card { background: var(--surface); border-left: 3px solid var(--brick); border-radius: 0 4px 4px 0; padding: 16px 20px; margin-bottom: 12px; }
  .note-card.context { border-left-color: var(--sage); }
  .note-card.watch { border-left-color: var(--amber-dim); }
  .note-card .note-tag { font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brick); margin-bottom: 6px; display: block; }
  .note-card.context .note-tag { color: var(--sage); }
  .note-card.watch .note-tag { color: var(--amber); }
  .note-card p { font-size: 15px; color: var(--bone-dim); }
  .onesided-banner { background: var(--surface); border: 1px dashed var(--bone-faint); border-radius: 4px; padding: 20px 24px; margin-bottom: 32px; }
  .onesided-banner .tag { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bone-faint); margin-bottom: 8px; }
  .onesided-banner p { font-size: 15px; color: var(--bone-dim); }
  .solo-profile { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 8px; }
  .solo-col .solo-label { font-family: 'IBM Plex Mono', monospace; font-size: 14.5px; color: var(--bone-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .solo-stat { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--hairline); font-size: 14.5px; }
  .solo-stat .v { font-family: 'IBM Plex Mono', monospace; color: var(--bone); }
  .solo-stat .rk { font-family: 'IBM Plex Mono', monospace; color: var(--bone-faint); font-size: 14.5px; }
  .footer { border-top: 1px solid var(--hairline); padding: 28px 0 60px; margin-top: 20px; }
  .footer p { font-size: 14.5px; color: var(--bone-faint); max-width: 640px; font-family: 'IBM Plex Mono', monospace; line-height: 1.7; }
  @media (max-width: 640px) {
    .wrap { padding: 0 18px; } .matchup h2 { font-size: 28px; } .pick-top { flex-direction: column; }
    .gauge-wrap { text-align: left; } .gauge { justify-content: flex-start; }
    .stat-row { grid-template-columns: 58px 1fr 80px 1fr 58px; font-size: 14.5px; }
    .solo-profile { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">THE LEDGER</span><span class="sub" id="week-label">WEEK · 2026</span></div>
</div>
<div class="subbar">
  <div class="conftabs" id="conftabs"></div>
  <div class="gametabs" id="gametabs"></div>
</div>

<div class="wrap">
  <div class="intro">
    <div class="eyebrow" id="intro-eyebrow">Full slate</div>
    <h1 class="display">Every pick shows its work.</h1>
    <p>No grade is shown without the reasoning behind it — including exactly why confidence is capped, and when our own model disagrees with the market. That disagreement is flagged as a caution, never hidden.</p>
  </div>
  <div id="games-container"></div>
</div>

<script>
const FOOTER_TEXT = "Confidence capped at 2 of 3 stars league-wide until validated Elo data exists for this season. This read uses Adjusted Rating: SP+ regressed for returning production, nudged for portal activity and coaching continuity. Not a guarantee — a documented methodology.";
const PARTIAL_FOOTER_TEXT = "Partial data by design — not a gap to guess around. See the full workbook for this team's complete roster-continuity breakdown.";

function fmtPct(v) { return v == null ? "—" : (v * 100).toFixed(1).replace(/\.0$/, "") + "%"; }
function fmtNum(v) { return v == null ? "—" : (typeof v === "number" ? v.toFixed(1) : v); }
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function renderStatRow(row) {
  const isPct = row.label.includes("%");
  const av = isPct ? fmtPct(row.away_val) : fmtNum(row.away_val);
  const hv = isPct ? fmtPct(row.home_val) : fmtNum(row.home_val);
  const awayPct = row.away_wins ? 58 : 42, homePct = 100 - awayPct;
  return `<div class="stat-row">
    <div class="team-a">${av}</div>
    <div class="bar-a"><div class="fill ${row.away_wins ? "win" : ""}" style="width:${awayPct}%"></div></div>
    <div class="cat">${esc(row.label)}</div>
    <div class="bar-b"><div class="fill ${!row.away_wins ? "win" : ""}" style="width:${homePct}%"></div></div>
    <div class="team-b">${hv}</div>
  </div>`;
}

function renderContinuityCard(row, awayDisp, homeDisp) {
  const av = fmtPct(row.away_val), hv = fmtPct(row.home_val);
  return `<div class="cont-card">
    <div class="label">${esc(row.label)}</div>
    <div class="cont-pair ${row.away_leads ? "lead" : ""}"><span class="pct">${av}</span><span class="who">${esc(awayDisp)}</span></div>
    <div class="cont-pair ${!row.away_leads ? "lead" : ""}"><span class="pct">${hv}</span><span class="who">${esc(homeDisp)}</span></div>
  </div>`;
}

function renderWeather(weather) {
  if (!weather) return "";
  if (weather.indoor) {
    return `<div class="weather-strip"><span class="w-label">Conditions</span><span class="w-item">Played indoors — weather not a factor.</span></div>`;
  }
  // same real thresholds as build_weather_notes.py — 0.01" is the exact level confirmed
  // to have affected North Carolina @ TCU; 15mph is the standard football-analysis cutoff
  const notable = (weather.precipitation >= 0.01) || (weather.wind_speed >= 15) ||
                   (weather.temperature >= 95) || (weather.temperature !== null && weather.temperature <= 25);
  const items = [];
  if (weather.temperature !== null) items.push(`<div class="w-item"><span class="w-label">Temp</span><b>${Math.round(weather.temperature)}°F</b></div>`);
  if (weather.wind_speed !== null) items.push(`<div class="w-item"><span class="w-label">Wind</span><b>${weather.wind_speed.toFixed(1)} mph</b></div>`);
  if (weather.precipitation !== null) items.push(`<div class="w-item"><span class="w-label">Precip</span><b>${weather.precipitation}"</b></div>`);
  if (weather.condition) items.push(`<div class="w-item"><span class="w-label">Forecast</span><b>${esc(weather.condition)}</b></div>`);
  const flag = notable ? `<span class="w-flag">Worth watching</span>` : "";
  return `<div class="weather-strip ${notable ? "notable" : ""}">${items.join("")}${flag}</div>`;
}

function renderNote(note) {
  return `<div class="note-card ${note.type}">
    <span class="note-tag">${esc(note.tag)}</span>
    <p>${esc(note.text)}</p>
  </div>`;
}

function renderFullGame(g, id) {
  const stars = g.pick.stars || 0;
  let gaugeHtml = "";
  for (let i = 0; i < 3; i++) {
    const isCeiling = i === 2; // capped at 2 of 3 until real Elo data exists this season
    const cls = i < stars ? "filled" : (isCeiling ? "ceiling empty" : "empty");
    gaugeHtml += `<div class="slot ${cls}"></div>`;
  }
  const whyRows = g.pick.reasons.map(r => {
    const isCaution = /caution|injury/i.test(r);
    return `<div class="why-row"><span class="why-flag ${isCaution ? "caution" : "signal"}">${isCaution ? "CAUTION" : "SIGNAL"}</span> ${esc(r)}</div>`;
  }).join("");
  return `<div class="game" id="${id}">
    <div class="g-eyebrow">${weekLabel}${g.is_conference_game ? " · Conference Game" : ""}</div>
    <div class="matchup"><h2 class="display">${esc(g.away)} <span class="at">at</span> ${esc(g.home)}</h2></div>
    <div class="market-line">${esc(g.home)} ${g.market_spread} · O/U ${g.market_total} <span class="ml">${esc(g.moneyline || "")}</span></div>
    ${renderWeather(g.weather)}
    <div class="pick-block">
      <div class="pick-top">
        <div><div class="pick-label">The Pick</div><div class="pick-lean">${esc(g.pick.side)} <span class="line">model implied ${g.pick.line}</span></div></div>
        <div class="gauge-wrap"><div class="gauge">${gaugeHtml}</div><div class="gauge-caption"><b>${stars} of 3</b></div></div>
      </div>
      <div class="pick-why">${whyRows}</div>
      ${g.ml_check ? `<div class="ml-check">${esc(g.ml_check)}</div>` : ""}
    </div>
    <div class="section-label">The Evidence — Core Stats</div>
    ${g.stat_rows.map(renderStatRow).join("")}
    <div class="mono" style="font-size:11.5px; color:var(--bone-faint); margin-top:14px;">${esc(g.tally.away_text)} · ${esc(g.tally.home_text)}</div>
    <div class="section-label">Roster Continuity</div>
    <div class="continuity-grid">${g.continuity.map(r => renderContinuityCard(r, g.away, g.home)).join("")}</div>
    ${g.case_notes.length ? `<div class="section-label">Case Notes</div>${g.case_notes.map(renderNote).join("")}` : ""}
    <div class="footer"><p>${FOOTER_TEXT}</p></div>
  </div>`;
}

function renderPartialGame(g, id) {
  const off = g.season_profile.offense.map(r => `<div class="solo-stat"><span>${esc(r.label)}</span><span class="v">${fmtNum(r.value)}</span><span class="rk">${esc(r.rank || "")}</span></div>`).join("");
  const def = g.season_profile.defense.map(r => `<div class="solo-stat"><span>${esc(r.label)}</span><span class="v">${fmtNum(r.value)}</span><span class="rk">${esc(r.rank || "")}</span></div>`).join("");
  return `<div class="game" id="${id}">
    <div class="g-eyebrow">${weekLabel} · One-sided data</div>
    <div class="matchup"><h2 class="display">${esc(g.away)} <span class="at">at</span> ${esc(g.home)}</h2></div>
    <div class="market-line">${esc(g.home)} ${g.market_spread} · O/U ${g.market_total} <span class="ml">${esc(g.moneyline || "")}</span></div>
    ${renderWeather(g.weather)}
    <div class="onesided-banner"><div class="tag">No pick made</div><p>${esc(g.onesided_note)}</p></div>
    <div class="section-label">${esc(g.known_team)} — Season Profile</div>
    <div class="solo-profile">
      <div class="solo-col"><div class="solo-label">Offense</div>${off}</div>
      <div class="solo-col"><div class="solo-label">Defense</div>${def}</div>
    </div>
    ${g.case_notes.length ? `<div class="section-label">Case Notes</div>${g.case_notes.map(renderNote).join("")}` : ""}
    <div class="footer"><p>${PARTIAL_FOOTER_TEXT}</p></div>
  </div>`;
}

let weekLabel = "Week 1";

function init(data) {
  weekLabel = data.week_label || weekLabel;
  document.getElementById("week-label").textContent = weekLabel.toUpperCase() + " · 2026";
  const confTabsEl = document.getElementById("conftabs");
  const gameTabsEl = document.getElementById("gametabs");
  const containerEl = document.getElementById("games-container");
  document.getElementById("intro-eyebrow").textContent = `Full slate — ${data.games.length} of ${data.games.length} games`;

  // Render every game up front (all content lives in the page, same as before — this
  // is about which tabs are VISIBLE at once, not lazy-loading), tagging each with its
  // conference so the game-tab row can be filtered.
  data.games.forEach((g, i) => {
    const id = `game-${i}`;
    g._id = id;
    containerEl.insertAdjacentHTML("beforeend", g.partial ? renderPartialGame(g, id) : renderFullGame(g, id));
  });

  // Group into conferences, sorted by size (most games first) so the biggest, most
  // relevant groups are the easiest to reach — real conferences before the small
  // "Other / FCS Matchups" catch-all bucket, regardless of alphabetical order.
  const byConf = {};
  data.games.forEach(g => { (byConf[g.conference] = byConf[g.conference] || []).push(g); });
  const confNames = Object.keys(byConf).sort((a, b) => byConf[b].length - byConf[a].length);

  // Top Picks — every game with real signal (1+ star), highest confidence first. 0★ means
  // "too thin to call" or "capped by disagreement," so those are correctly excluded rather
  // than padding out the list with games that have no real edge.
  const TOP_PICKS = "__TOP_PICKS__";
  const topPicks = data.games
    .filter(g => !g.partial && g.pick.stars >= 1)
    .sort((a, b) => b.pick.stars - a.pick.stars);
  byConf[TOP_PICKS] = topPicks;

  function showConference(confName) {
    document.querySelectorAll(".conftab").forEach(t => t.classList.toggle("active", t.dataset.conf === confName));

    });
    showGame(games[0]._id);
  }

    document.querySelectorAll(".gametab").forEach(t => t.classList.toggle("active", t.dataset.game === id));
    document.querySelectorAll(".game").forEach(g => g.classList.toggle("active", g.id === id));

  }

  if (topPicks.length > 0) {
    const tab = document.createElement("button");
    tab.className = "conftab top-picks";
    tab.dataset.conf = TOP_PICKS;
    tab.textContent = `★ TOP PICKS (${topPicks.length})`;
    tab.addEventListener("click", () => showConference(TOP_PICKS));
    confTabsEl.appendChild(tab);
  }

  confNames.forEach(confName => {
    const tab = document.createElement("button");
    tab.className = "conftab";
    tab.dataset.conf = confName;
    tab.textContent = `${confName} (${byConf[confName].length})`;
    tab.addEventListener("click", () => showConference(confName));
    confTabsEl.appendChild(tab);
  });

  showConference(topPicks.length > 0 ? TOP_PICKS : confNames[0]);
}

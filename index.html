<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steady Metrics · College Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --navy:#0F1B33; --blue:#0A3161; --red:#B31942; --red-dk:#8F1233;
  --cream:#F6F1E7; --card:#FFFFFF; --line:#E4DCCB; --muted:#566079; --brown:#8B4A23; --tint:#EFE8D8;
  --ok:#1D6B45; --shadow:0 1px 2px rgba(20,33,61,.06),0 6px 20px rgba(20,33,61,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* header */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.top svg.logo{width:44px;height:44px;flex:none}
.brand{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:18px;line-height:1.1}
.brand small{display:block;font-family:Inter,sans-serif;font-weight:500;letter-spacing:.04em;text-transform:none;font-size:13px;color:#C7CFE0}
.nav{margin-left:auto;display:flex;gap:6px}
.nav a{color:#E8ECF5;text-decoration:none;font-weight:600;font-size:14px;padding:10px 14px;border-radius:999px;min-height:44px;display:inline-flex;align-items:center}
.nav a:hover{background:rgba(255,255,255,.1)}
.stripe{height:5px;background:linear-gradient(90deg,var(--red) 0 33.3%,#fff 33.3% 66.6%,var(--blue) 66.6%)}

/* hero */
.hero{padding:36px 0 8px}
.hero .wrap{display:flex;align-items:center;gap:28px}
.hero h1{font-size:clamp(40px,7vw,72px);line-height:1;color:var(--ink)}
.hero h1 span{color:var(--red)}
.hero p{margin:10px 0 0;color:var(--muted);font-size:17px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:96px}
.stat b{display:block;font-family:Oswald,sans-serif;font-size:28px;line-height:1.1;color:var(--ink)}
.stat span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero svg.big{width:150px;height:150px;margin-left:auto;flex:none}

/* section head */
.sec{padding:34px 0 8px}
.sec h2{font-size:28px;display:flex;align-items:center;gap:12px}
.sec h2::after{content:"";height:3px;flex:1;background:linear-gradient(90deg,var(--red) 0 33%,var(--line) 33%);border-radius:2px}

/* plays */
.plays{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:18px}
.play{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.play .bar{background:var(--ink);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;letter-spacing:.04em}
.stars{color:#fff;letter-spacing:3px;font-size:16px}
.stars i{font-style:normal;color:#F2C14E}
.stars .off{color:rgba(255,255,255,.28)}
.play .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.pick{font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:32px;line-height:1.1;color:var(--ink)}
.pick em{font-style:normal;color:var(--red);margin-left:8px;white-space:nowrap}
.game{color:var(--muted);font-size:14px;margin-top:-4px}
.why{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.why li{display:flex;gap:10px;font-size:15px;line-height:1.4}
.tag{flex:none;align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:5px;margin-top:2px;min-width:44px;text-align:center}
.tag.w{background:#E3F1E9;color:var(--ok)}
.tag.r{background:#F8E3E8;color:var(--red-dk)}
.play .more{margin-top:auto;align-self:flex-start;background:none;border:0;padding:10px 0 0;color:var(--blue);font-weight:700;font-size:14px;min-height:44px}
.play .more:hover{text-decoration:underline}

/* slate */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:44px;font-weight:600;font-size:14px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.search{margin-left:auto;min-height:44px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font:inherit;background:var(--card);min-width:200px;color:var(--ink)}
.search:focus,.chip:focus-visible,.row>button:focus-visible,.nav a:focus-visible,.more:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.day{font-family:Oswald,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--muted);margin:26px 2px 10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.row.isplay{border-left:5px solid var(--red)}
.row>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:78px 1fr auto 28px;gap:14px;align-items:center;width:100%;padding:14px 16px;cursor:pointer;min-height:64px}
.row>button:hover{background:#FBF8F1}
.time{font-weight:700;font-size:14px;color:var(--ink)}
.time small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.teams{display:grid;gap:2px;font-weight:600;font-size:16px}
.teams .t{display:flex;align-items:center;gap:8px}
.teams .rk{font-size:12px;font-weight:700;color:#fff;background:var(--blue);border-radius:5px;padding:1px 6px}
.teams .rc{font-weight:500;color:var(--muted);font-size:13px}
.num{text-align:right;font-size:14px;color:var(--muted);line-height:1.35}
.num b{display:block;color:var(--ink);font-size:15px}
.badge{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:12px;letter-spacing:.05em;border-radius:6px;padding:2px 8px;margin-top:4px;text-transform:uppercase}
.chev{width:12px;height:12px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s;justify-self:center}
.row.open .chev{transform:rotate(-135deg)}
.detail{display:none;border-top:1px solid var(--line);padding:18px 18px 20px;background:#FDFBF6}
.row.open .detail{display:block}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.col h3{font-size:20px;display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.col h3 span{color:var(--red)}
.col.pickside h3{border-bottom-color:var(--red)}
.b{display:flex;gap:10px;margin:0 0 9px;font-size:15px;line-height:1.4}
.k{flex:none;width:68px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);padding-top:3px}
.k.Against{color:var(--red-dk)}
.k.Spot{color:var(--red)}
.empty{color:var(--muted);font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{background:var(--tint);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.pill.warn{background:#F8E3E8;color:var(--red-dk)}
.form{display:flex;gap:5px;align-items:center;margin-top:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.form .lab{font-weight:600;color:var(--ink);min-width:110px}
.dot{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
.dot.W{background:var(--ok)} .dot.L{background:var(--red)}
.h2h{margin-top:18px}.h2h h4{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:16px;font-weight:600;margin:0 0 6px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}.h2h h4 span{font-family:Inter,sans-serif;text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted);font-weight:600}
.h2h .m{display:grid;grid-template-columns:48px 1fr auto;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}.h2h .m b{color:var(--red-dk)}.h2h .m i{font-style:normal;color:var(--muted);font-size:13px}
.notes{margin-top:16px;display:grid;gap:8px}
.note{font-size:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.note b{color:var(--red-dk)}
.none{padding:40px 0;text-align:center;color:var(--muted)}

@media (max-width:760px){
  .hero .wrap{flex-direction:column;align-items:flex-start}
  .hero svg.big{display:none}
  .cols{grid-template-columns:1fr;gap:18px}
  .row>button{grid-template-columns:62px 1fr 24px;grid-template-areas:"t m c" "n n n"}
  .row>button .time{grid-area:t}.row>button .teams{grid-area:m}.row>button .chev{grid-area:c}
  .row>button .num{grid-area:n;text-align:left;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
  .row>button .num b{display:inline}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{min-width:0;padding:8px 10px}.stat b{font-size:24px}.stat span{font-size:10px;letter-spacing:.05em}
  .search{margin-left:0;width:100%}
  .nav a{padding:10px 10px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chev{transition:none}}
</style>
</head>

function bullets(sd, isPick){

  const b=[...sd.b].sort((x,y)=>(order[x.k]??9)-(order[y.k]??9));

}
function formRow(label,f){ if(!f||!f.length) return ''; return '<div class="form"><span class="lab">'+esc(label)+'</span>'+f.map(x=>'<span class="dot '+x.r+'" title="'+esc((x.v==='at'?'at ':x.v==='neutral'?'vs ':'vs ')+x.o+' '+x.s)+'">'+x.r+'</span>').join('')+'<span>'+esc(f.map(x=>x.r+' '+x.s).slice(-1)[0] ? 'last: '+f[f.length-1].r+' '+f[f.length-1].s+' '+(f[f.length-1].v==='at'?'at':'vs')+' '+f[f.length-1].o : '')+'</span></div>'; }
function detail(g){

  return h;
}
function render(){
  let list=G.filter(g=>{
    if(filt==='plays'&&!g.play) return false;
    if(filt==='ranked'&&!(g.ar||g.hr)) return false;
    if(filt.startsWith('d:')&&g.date!==filt.slice(2)) return false;
    if(q){ const t=(g.a+' '+g.h).toLowerCase(); if(!t.includes(q)) return false; }
    return true;
  }).sort((a,b)=>(a.date+(a.tbd?'99:99':'')+a.time).localeCompare(b.date+(b.tbd?'99:99':'')+b.time) || a.id-b.id);
  // proper time sort
  const tmin=g=>{ if(g.tbd||!g.time) return 9999; const m=g.time.match(/(\d+):(\d+) ([AP]M)/); let h=+m[1]%12+(m[3]==='PM'?12:0); return h*60+ +m[2]; };
  list.sort((a,b)=>a.date.localeCompare(b.date)||tmin(a)-tmin(b)||a.id-b.id);
  if(!list.length){ $('#list').innerHTML='<p class="none">No games match.</p>'; return; }
  let out='', cur='';
  for(const g of list){
    if(g.date!==cur){ cur=g.date; out+='<div class="day">'+esc(cur?fmtDay(cur):'Date TBD')+'</div>'; }
    const aR=g.ar?'<span class="rk">'+g.ar+'</span>':'', hR=g.hr?'<span class="rk">'+g.hr+'</span>':'';

      +'<span class="chev" aria-hidden="true"></span></button><div class="detail">'+(g.partial?'<p class="empty">Line not posted yet.</p>':detail(g))+'</div></div>';
  }

}
function openGame(id){
  filt='all'; q=''; $('#q').value=''; document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.f==='all'));
  render(); const r=document.getElementById('g'+id); r.classList.add('open'); r.querySelector('button').setAttribute('aria-expanded','true');
  r.scrollIntoView({behavior:'smooth',block:'start'});
}
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]'); if(go){ openGame(go.dataset.go); return; }
  const c=e.target.closest('.chip'); if(c){ filt=c.dataset.f; document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c)); render(); return; }
  const b=e.target.closest('.row>button'); if(b){ const r=b.parentElement; const o=r.classList.toggle('open'); b.setAttribute('aria-expanded',o); }
});
$('#q').addEventListener('input',e=>{ q=e.target.value.trim().toLowerCase(); render(); });
render();
</script>
</body>
</html>
